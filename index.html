<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="color-scheme" content="dark">
  <title>Le laboratoire de Flo ✦</title>
  <meta name="description" content="Aline, une petite visite t’attend dans le laboratoire de Flo ✦">
  <meta property="og:title" content="Le laboratoire de Flo ✦">
  <meta property="og:description" content="Aline, une expérience a été préparée spécialement pour toi.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="wow-v2.css?v=2">
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header id="hud" class="hud hidden" aria-label="Progression du jeu">
    <div class="hud-brand"><span class="brand-orb"></span><span>HYPERSMART LAB</span></div>
    <div class="hud-progress" aria-label="Progression">
      <div class="progress-track"><span id="progressFill"></span></div>
      <span id="progressText">0 / 5</span>
    </div>
    <button id="soundButton" class="icon-button" type="button" aria-label="Activer ou couper le son">SON</button>
  </header>

  <main id="app" class="app" aria-live="polite">
    <section id="scene" class="scene"></section>
  </main>

  <aside id="aiGuide" class="ai-guide hidden" aria-live="polite">
    <div class="ai-avatar" aria-hidden="true"><span></span></div>
    <div class="ai-copy">
      <small>IA DU LABORATOIRE</small>
      <p id="aiText"></p>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="game.js?v=2" defer></script>
  <script src="wow-v2.js?v=2" defer></script>
</body>
</html>
